[project]
name = "salt-template"
version = "1.3.0"
authors = [{ name = "Jan Graichen", email = "jgraichen@altimos.de" }]
license = { text = "MIT" }
requires-python = ">=3.10,<4.0"
readme = "README.md"
dependencies = ["salt"]

[dependency-groups]
test = [
  "pylint~=4.0.4", #
  "pytest~=9.1.1",
]
lint = [
  "ruff==0.16.8", #
]
dev = [
  { include-group = "test" }, #
  { include-group = "lint" },
  "nox~=2025.5.1",
]

[tool.pylint.basic]
good-names = "a,b,fd,k,v"

[tool.pylint.variables]
additional-builtins = "__salt__,__opts__,__grains__,__pillar__"

[tool.pylint.similarities]
min-similarity-lines = 6
ignore-imports = true

[tool.pyright]
include = ["_modules", "_templates", "test"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
builtins = ["__grains__", "__opts__", "__pillar__", "__salt__"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
extend-select = ["I"]
ignore = [
  # Invalid pillar data is a data error surfaced to the user, not a
  # programming error, therefore these templates raise `ValueError`.
  "TRY004",
]

[tool.ruff.lint.per-file-ignores]
# The `#!py` line selects salt's python renderer, these templates are
# not executable scripts.
"_templates/*.py" = ["EXE001"]
